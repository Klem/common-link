#TODO: make the tests full PG-sql
spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: false

app:
  jwt:
    secret: ${COMMON_LINK_SECRET:test-secret-key-for-automated-tests-only-not-production!!}
  frontend-url: http://localhost:3000
  # Unroutable on purpose: tests never call geo.api.gouv.fr (geocoding is best-effort or mocked).
  geo:
    base-url: http://localhost:1
  bridge:
    # Simulated by default: the regular build has no Bridge credentials, and with demo-mode false
    # BridgePaymentInitiationService refuses to start without them (every Spring context would fail).
    # A test-only variable on purpose: BRIDGE_DEMO_MODE is an app variable that Clever Cloud also
    # exposes to the build.
    demo-mode: ${BRIDGE_TEST_DEMO_MODE:true}

onchain:
  # Simulated by default: the regular build (Clever Cloud runs `test -PnoDocker`) never needs a chain.
  # Blockchain sprints run the suite against the local Anvil node with ONCHAIN_TEST_MOCK=false (or false here):
  # the node must be up with the registry deployed (blockchain/RUNBOOK.md §6), or every Spring context
  # refuses to start (OnchainRealModeValidator probes the RPC). RPC, chain, registry and recorder key are
  # then the Anvil defaults of application.yml.
  # A test-only variable on purpose: ONCHAIN_MOCK is an app variable that Clever Cloud also exposes to the
  # build, and must never switch the build's tests onto the staging chain and recorder key.
  mock: ${ONCHAIN_TEST_MOCK:true}
  donor-address-secret: "test-donor-address-secret-placeholder-32ch"
  association-address-secret: "test-association-address-secret-placehold"
  worker:
    enabled: false

donation:
  receipt:
    reconciler-initial-delay-ms: 3600000

logging:
  level:
    org.commonlink: DEBUG
