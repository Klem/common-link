# ──────────────────────────────────────────────────────────────
# Staging profile — activated via SPRING_PROFILES_ACTIVE=staging
# Reads Clever Cloud auto-injected POSTGRESQL_ADDON_* variables
# ──────────────────────────────────────────────────────────────

server:
  port: 8080
  address: 0.0.0.0   # Required: CC reverse proxy needs to reach the app

spring:
  datasource:
    url: jdbc:postgresql://${POSTGRESQL_ADDON_HOST}:${POSTGRESQL_ADDON_PORT}/${POSTGRESQL_ADDON_DB}
    username: ${POSTGRESQL_ADDON_USER}
    password: ${POSTGRESQL_ADDON_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5   # CC dev plan has limited connections
      minimum-idle: 1

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    show-sql: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    defaults:
      enabled: true
    db:
      enabled: true
    mail:
      enabled: false  # Don't tie app liveness to SMTP availability

app:
  jwt:
    secret: ${COMMON_LINK_SECRET}
  frontend-url: ${COMMON_LINK_FRONTEND_URL}
  google:
    client-id: ${YOUR_GOOGLE_CLIENT_ID:}
  mail:
    from: ${MAIL_FROM:noreply@commonlink.org}
    verification-review-to: ${MAIL_VERIFICATION_REVIEW_TO:review@commonlink.org}
  insee:
    api-key: ${INSEE_API_KEY:}
    base-url: ${INSEE_BASE_URL:https://api.insee.fr/api-sirene/3.11}
  joafe:
    base-url: ${JOAFE_BASE_URL:https://journal-officiel-datadila.opendatasoft.com/api/explore/v2.0}
  bodacc:
    base-url: ${BODACC_BASE_URL:https://bodacc-datadila.opendatasoft.com/api/explore/v2.0}
  recherche-entreprises:
    base-url: ${RECHERCHE_ENTREPRISES_BASE_URL:https://recherche-entreprises.api.gouv.fr}
  vop:
    demo-mode: true
    api-url: ${VOP_BASE_URL:https://thirdparty.qonto.com/v2/sepa/verify_payee}
    api-token: ${VOP_API_TOKEN:}
  monerium:
    client-id: ${MONERIUM_CLIENT_ID:}
    base-url: ${MONERIUM_BASE_URL:}
    redirect-uri: ${MONERIUM_REDIRECT_URI:}
    skip-kyc: true
    token-enc-key: ${MONERIUM_TOKEN_ENC_KEY:}

springdoc:
  api-docs:
    enabled: true
    path: /api/docs/api.json
  swagger-ui:
    enabled: true
    path: /api/docs/swagger-ui.html

onchain:
  mock: true
  worker:
    enabled: true
    batch-size: 10
    fixed-delay-ms: 30000

logging:
  level:
    root: INFO
    org.commonlink: INFO
    org.springframework: INFO
    org.springframework.boot.actuate: DEBUG
