# ──────────────────────────────────────────────────────────────
# Production profile — activated via SPRING_PROFILES_ACTIVE=prod
# ⚠ SECURITY: base application.yml ships fail-OPEN (it doubles as the local-dev
# profile). Every safety flag below is set EXPLICITLY so prod never inherits a lax
# base default. If SPRING_PROFILES_ACTIVE is unset/misspelled the app boots on base
# and these overrides do NOT apply — verify the active profile on every deploy.
# ──────────────────────────────────────────────────────────────

server:
  port: 8080
  address: 0.0.0.0   # Required: CC reverse proxy needs to reach the app
  # Makes Spring honour X-Forwarded-Proto/Host from the CC proxy, so requests are seen as HTTPS.
  # Without it Strict-Transport-Security is never emitted — the header writer skips insecure
  # requests, and every request looks insecure behind the proxy (security audit 2026-08-20, M9).
  # Safe here: no absolute URL is derived from the request; they all come from configuration.
  forward-headers-strategy: framework

spring:
  application:
    name: commonlink-api
  config:
    import: "classpath:compliance/risk-classification.yml"
  datasource:
    url: jdbc:postgresql://${POSTGRESQL_ADDON_HOST}:${POSTGRESQL_ADDON_PORT}/${POSTGRESQL_ADDON_DB}
    username: ${POSTGRESQL_ADDON_USER}
    password: ${POSTGRESQL_ADDON_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5   # CC dev plan has limited connections
      minimum-idle: 1

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  jpa:
    open-in-view: true  # TODO: refactor to set to "false" safe once all read service methods are @Transactional(readOnly=true)
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB


management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      # /actuator/health is permitAll in SecurityConfig, so `always` published the component detail
      # — database vendor and reachability, disk space, subsystem names — to anyone who asked
      # (security audit 2026-08-20, M8). The liveness/readiness probes below stay public and are all
      # the Clever Cloud health check needs; the detail is now visible only to an authorised caller.
      show-details: when-authorized
      probes:
        enabled: true
  health:
    defaults:
      enabled: true
    db:
      enabled: true
    mail:
      enabled: false  # Don't tie app liveness to SMTP availability

app:
  jwt:
    secret: ${COMMON_LINK_SECRET}
    access-token-expiration: PT30M
  frontend-url: ${COMMON_LINK_FRONTEND_URL}
  cookies:
    secure: true
    same-site: Strict #set "strict" if frontend and backend are on the same domain (app/api.common-link.org)
  security:
    # One Clever Cloud reverse proxy appends the real client address to X-Forwarded-For, so the
    # rightmost entry is the only trustworthy one (ClientIpResolver). Raise this if another
    # appending proxy is ever placed in front — too low a value throttles the proxy instead of the
    # client, too high a value throttles a forgeable value.
    trusted-proxy-count: ${APP_TRUSTED_PROXY_COUNT:1}
  google:
    client-id: ${YOUR_GOOGLE_CLIENT_ID:}
  mail:
    from: ${MAIL_FROM:no-reply@commonlink.org}
  technical:
    # Developer/on-call mailbox for technical incidents raised by GlobalExceptionHandler
    # (TechnicalAlertService): unhandled 500s, Mollie failures, unreachable upstreams, and bursts of
    # 403/429. Deliberately separate from app.compliance.alert-notification-email — different
    # readers, different urgency. Blank disables alerting and logs a warning; there is no startup
    # guard, because refusing to boot over an unset dev mailbox is worse than the incident.
    notification-email: ${APP_TECHNICAL_NOTIFICATION_EMAIL:}
    alerts-enabled: ${APP_TECHNICAL_ALERTS_ENABLED:true}
    # The sources are exception handlers, so an incident produces one event per request. Without
    # these two throttles a single outage becomes thousands of e-mails and a blacklisted sender.
    cooldown: PT30M
    # 403/429 are only reported as a rate: one is normal traffic, this many in the window is a probe.
    burst-threshold: 20
    burst-window: PT5M
  insee:
    api-key: ${INSEE_API_KEY}
    base-url: ${INSEE_BASE_URL:https://api.insee.fr/api-sirene/3.11}
  joafe:
    base-url: ${JOAFE_BASE_URL:https://journal-officiel-datadila.opendatasoft.com/api/explore/v2.0}
  bodacc:
    base-url: ${BODACC_BASE_URL:https://bodacc-datadila.opendatasoft.com/api/explore/v2.0}
  recherche-entreprises:
    base-url: ${RECHERCHE_ENTREPRISES_BASE_URL:https://recherche-entreprises.api.gouv.fr}
  vop:
    demo-mode: false
    api-url: ${VOP_BASE_URL:https://thirdparty.qonto.com/v2/sepa/verify_payee}
    api-token: ${VOP_API_TOKEN:}
  mollie:
    api-key: ${MOLLIE_API_KEY}
    api-base-url: ${MOLLIE_API_BASE_URL:https://api.mollie.com}
    redirect-base-url: ${MOLLIE_REDIRECT_BASE_URL}
    webhook-url: ${MOLLIE_WEBHOOK_URL}
    test-mode: false
    token-enc-key: ${MOLLIE_TOKEN_ENC_KEY}
    connect:
      client-id: ${MOLLIE_CONNECT_CLIENT_ID}
      client-secret: ${MOLLIE_CONNECT_CLIENT_SECRET}
      advanced-token: ${MOLLIE_CONNECT_ADVANCED_TOKEN}
      redirect-uri: ${MOLLIE_CONNECT_REDIRECT_URI}
      scopes: "onboarding.read onboarding.write organizations.read payments.read payments.write profiles.read profiles.write"
      #switch between /onboarding/me (LEGACY) and the new /capabilities (CAPABILITIES)
      onboarding-api: LEGACY
      #Mock the entire mollie process
      mock: false
      allow-fake-completion: false

  curator:
    email: ${APP_CURATOR_EMAIL}
    password: ${APP_CURATOR_PASSWORD}
  # Compliance officer bootstrap — set both env vars to provision the LCB-FT compliance officer account.
  # The bean is absent when APP_COMPLIANCE_OFFICER_EMAIL is unset; no runtime cost in normal operation.
  compliance-officer:
    email: ${APP_COMPLIANCE_OFFICER_EMAIL}
    password: ${APP_COMPLIANCE_OFFICER_PASSWORD}

  compliance:
    # Function mailbox notified when an asset-freeze alert is raised on a donor
    # (ComplianceAlertEmailListener). A role address, not a person: the alert must keep reaching the
    # compliance function across staff changes. Blank disables the notification and logs a warning.
    alert-notification-email: ${APP_COMPLIANCE_OFFICER_EMAIL}


commonlink:
  compliance:
    # No default (unlike base/staging): an absent COMPLIANCE_ENCRYPTION_KEY fails placeholder
    # resolution outright. ComplianceCryptoConverter's own init{} guard is the second line of
    # defense if this property is ever redefined with a blank fallback.
    encryption-key: ${COMPLIANCE_ENCRYPTION_KEY}
  sanctions:
    screening:
      score-threshold: 0.85
      # S1: test data must never be active in production — enforced by ProdConfigSecurityTest.
      use-test-data: false
      registry-url: https://gels-avoirs.dgtresor.gouv.fr/ApiPublic/api/v1/publication/derniere-publication-fichier-xml
    sync:
      # S2: sync frequency must not exceed 24 h in production. A stale register is a latent LCB-FT breach.
      fixed-delay-ms: 86400000
      initial-delay-ms: 60000

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

onchain:
  mock: true
  rpc-url: ${ONCHAIN_RPC_URL}
  chain-id: ${ONCHAIN_CHAIN_ID}
  # Empty defaults — safe because both OnchainRegistryClient and Web3jConfig (which builds the
  # signing credentials from recorder-pk / curator-pk) are inactive when mock=true.
  # Prod supply real values via environment variables.
  registry-address: ${ONCHAIN_REGISTRY_ADDRESS:}
  recorder-pk: ${ONCHAIN_RECORDER_PK:}
  curator-pk: ${ONCHAIN_CURATOR_PK:}
  polling-interval-ms: ${ONCHAIN_POLLING_INTERVAL_MS:1500}
  receipt-timeout-ms: ${ONCHAIN_RECEIPT_TIMEOUT_MS:60000}
  donor-address-secret: ${DONOR_ADDRESS_SECRET:dev-placeholder-change-in-staging}
  association-address-secret: ${ASSOCIATION_ADDRESS_SECRET:dev-placeholder-change-in-prod}
  worker:
    enabled: true
    batch-size: 10
    fixed-delay-ms: 30000

logging:
  level:
    root: INFO
    org.commonlink: INFO
    org.springframework: INFO
    org.springframework.boot.actuate: DEBUG
