systemProp.http.proxyHost=
systemProp.http.proxyPort=
systemProp.https.proxyHost=
systemProp.https.proxyPort=
systemProp.http.nonProxyHosts=*
# Mémoire Gradle (laisser de la marge pour le système)
org.gradle.jvmargs=-Xmx384m -XX:MaxMetaspaceSize=160m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -Dkotlin.compiler.execution.strategy=in-process

# Kotlin compile en in-process (évite un 2e processus JVM)
kotlin.daemon.jvmargs=-Xmx256m -XX:MaxMetaspaceSize=128m

# Limiter au maximum la consommation
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.workers.max=1

# Kotlin
kotlin.incremental=true
kotlin.compiler.execution.strategy=in-process